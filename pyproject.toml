[project]
name = "vaultmind"
version = "1.1.0"
description = "A secure, fully offline password manager for Windows and macOS."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enes Öztürk" }]
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.0",
    "cryptography>=41.0.0",
    "pyperclip>=1.8.2",
]

[project.urls]
Homepage = "https://github.com/DevVettel/VaultMind"
Issues = "https://github.com/DevVettel/VaultMind/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["password_manager"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["password_manager", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long QSS strings
    "UP006",  # keep typing.Tuple etc. readable for 3.9 users
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "version"]
